name: No-cost checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Pinned no-cost gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.13
          cache: false
      - name: Install locked dependencies
        run: mise x -- pnpm install --frozen-lockfile
      - name: Typecheck
        run: mise x -- pnpm typecheck
      - name: Lint
        run: mise x -- pnpm lint
      - name: Test
        run: mise x -- pnpm test
      - name: Verify Git fixtures
        run: mise x -- pnpm test:fixtures
      - name: Build
        run: mise x -- pnpm build
      - name: Smoke development and production
        run: mise x -- pnpm smoke
